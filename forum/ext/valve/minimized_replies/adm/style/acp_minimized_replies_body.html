<!-- INCLUDE overall_header.html -->

<h1>{L_ACP_MINIMIZED_REPLIES}</h1>

<form id="acp_minimized_replies" method="post" action="{U_ACTION}">
	<fieldset>
		<legend>{L_ACP_MINIMIZED_REPLIES_SETTINGS}</legend>

		<dl>
			<dt><label for="minimized_replies_enabled">{L_ACP_MINIMIZED_REPLIES_ENABLED}{L_COLON}</label><br />
				<span>{L_ACP_MINIMIZED_REPLIES_ENABLED_EXPLAIN}</span>
			</dt>
			<dd>
				<label><input type="radio" class="radio" name="minimized_replies_enabled" value="1"<!-- IF MINIMIZED_REPLIES_ENABLED --> checked="checked"<!-- ENDIF --> /> {L_ENABLED}</label>
				<label><input type="radio" class="radio" name="minimized_replies_enabled" value="0"<!-- IF not MINIMIZED_REPLIES_ENABLED --> checked="checked"<!-- ENDIF --> /> {L_DISABLED}</label>
			</dd>
		</dl>

		<dl>
			<dt><label for="minimized_replies_threshold">{L_ACP_MINIMIZED_REPLIES_THRESHOLD}{L_COLON}</label><br />
				<span>{L_ACP_MINIMIZED_REPLIES_THRESHOLD_EXPLAIN}</span>
			</dt>
			<dd>
				<input type="number" id="minimized_replies_threshold" name="minimized_replies_threshold" value="{MINIMIZED_REPLIES_THRESHOLD}" min="1" max="50" />
			</dd>
		</dl>

		<dl>
			<dt><label for="minimized_replies_preview_length">{L_ACP_MINIMIZED_REPLIES_PREVIEW_LENGTH}{L_COLON}</label><br />
				<span>{L_ACP_MINIMIZED_REPLIES_PREVIEW_LENGTH_EXPLAIN}</span>
			</dt>
			<dd>
				<input type="number" id="minimized_replies_preview_length" name="minimized_replies_preview_length" value="{MINIMIZED_REPLIES_PREVIEW_LENGTH}" min="20" max="200" />
			</dd>
		</dl>

		<dl>
			<dt><label for="minimized_replies_use_threading">{L_ACP_MINIMIZED_REPLIES_USE_THREADING}{L_COLON}</label><br />
				<span>{L_ACP_MINIMIZED_REPLIES_USE_THREADING_EXPLAIN}</span>
			</dt>
			<dd>
				<label><input type="radio" class="radio" name="minimized_replies_use_threading" value="1"<!-- IF MINIMIZED_REPLIES_USE_THREADING --> checked="checked"<!-- ENDIF --> /> {L_ENABLED}</label>
				<label><input type="radio" class="radio" name="minimized_replies_use_threading" value="0"<!-- IF not MINIMIZED_REPLIES_USE_THREADING --> checked="checked"<!-- ENDIF --> /> {L_DISABLED}</label>
			</dd>
		</dl>
	</fieldset>

	<fieldset class="submit-buttons">
		<legend>{L_SUBMIT}</legend>
		<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}" />&nbsp;
		<input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}" />
	</fieldset>
	{S_FORM_TOKEN}
</form>

<!-- INCLUDE overall_footer.html -->
