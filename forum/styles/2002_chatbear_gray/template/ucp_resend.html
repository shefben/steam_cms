<!-- INCLUDE overall_header.html -->

<!-- Resend Activation Form -->
<table cellpadding="0" cellspacing="0" border="0" bgcolor="#3E4637" width="100%" align="center">
<tr>
    <td>
        <table cellpadding="4" cellspacing="1" border="0" width="100%">
        <tr>
            <td bgcolor="#3E4637" colspan="2" align="center">
                <font face="verdana,arial,helvetica" size="1" color="#D8DED3"><b>{L_SEND_ACTIVATION_EMAIL}</b></font>
            </td>
        </tr>
        <tr>
            <td bgcolor="#545F4E" colspan="2">
                <form method="post" action="{S_UCP_ACTION}">

                <font face="verdana,arial,helvetica" size="2">
                    {L_EXPLAIN}
                </font>
                <br /><br />

                <table cellpadding="3" cellspacing="1" border="0" width="100%">
                <tr bgcolor="#424B3C">
                    <td colspan="2">
                        <font face="verdana,arial,helvetica" size="1" color="#D8DED3"><b>{L_RESEND}</b></font>
                    </td>
                </tr>
                <tr bgcolor="#4C5844">
                    <td width="30%">
                        <font face="verdana,arial,helvetica" size="2">{L_USERNAME}:</font>
                    </td>
                    <td width="70%">
                        <input class="bginput" type="text" name="username" size="25" maxlength="40" />
                    </td>
                </tr>
                <tr bgcolor="#545F4E">
                    <td width="30%">
                        <font face="verdana,arial,helvetica" size="2">{L_EMAIL_ADDRESS}:</font>
                    </td>
                    <td width="70%">
                        <input class="bginput" type="email" name="email" size="25" maxlength="100" />
                    </td>
                </tr>
                </table>

                <br />
                <table cellpadding="3" cellspacing="0" border="0" width="100%">
                <tr>
                    <td align="center">
                        {S_HIDDEN_FIELDS}
                        <input type="submit" name="submit" class="bginput" value="{L_SUBMIT}" />
                        {S_FORM_TOKEN}
                    </td>
                </tr>
                </table>

                </form>
            </td>
        </tr>
        </table>
    </td>
</tr>
</table>

<!-- INCLUDE overall_footer.html -->
