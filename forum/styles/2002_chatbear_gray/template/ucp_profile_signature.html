<!-- INCLUDE ucp_header.html -->

<!-- Signature Form -->
<form id="ucp" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>

<table cellpadding="0" cellspacing="0" border="0" width="100%">
<tr>
    <td>
        <table cellpadding="3" cellspacing="1" border="0" width="100%">
        <tr bgcolor="#424B3C">
            <td colspan="2">
                <font face="verdana,arial,helvetica" size="1" color="#D8DED3"><b>{L_SIGNATURE}</b></font>
            </td>
        </tr>

        <!-- IF ERROR -->
        <tr bgcolor="#4C5844">
            <td colspan="2">
                <font face="verdana,arial,helvetica" size="2" color="#FF6600"><b>{ERROR}</b></font>
            </td>
        </tr>
        <!-- ENDIF -->

        <tr bgcolor="#4C5844">
            <td colspan="2">
                <font face="verdana,arial,helvetica" size="2">{L_SIGNATURE}:</font><br />
                <font face="verdana,arial,helvetica" size="1">{L_SIGNATURE_EXPLAIN}</font><br /><br />
                <textarea name="signature" rows="6" cols="60" class="bginput">{SIGNATURE}</textarea>
            </td>
        </tr>

        <!-- IF SIGNATURE_PREVIEW -->
        <tr bgcolor="#545F4E">
            <td colspan="2">
                <font face="verdana,arial,helvetica" size="2"><b>{L_SIGNATURE_PREVIEW}:</b></font><br />
                {SIGNATURE_PREVIEW}
            </td>
        </tr>
        <!-- ENDIF -->
        </table>

        <br />
        <table cellpadding="3" cellspacing="0" border="0" width="100%">
        <tr>
            <td align="center">
                {S_HIDDEN_FIELDS}
                <input type="submit" name="preview" value="{L_PREVIEW}" class="bginput" />
                <input type="submit" name="submit" value="{L_SUBMIT}" class="bginput" />
                {S_FORM_TOKEN}
            </td>
        </tr>
        </table>
    </td>
</tr>
</table>

</form>

<!-- INCLUDE ucp_footer.html -->
