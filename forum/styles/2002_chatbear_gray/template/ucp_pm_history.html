<!-- PM History -->
<br />
<table cellpadding="3" cellspacing="1" border="0" width="100%">
<tr bgcolor="#424B3C">
    <td colspan="3">
        <font face="verdana,arial,helvetica" size="1" color="#D8DED3"><b>{L_MESSAGE_HISTORY}</b></font>
    </td>
</tr>

<!-- BEGIN history -->
<tr bgcolor="<!-- IF history.S_ROW_COUNT is odd -->#4C5844<!-- ELSE -->#545F4E<!-- ENDIF -->">
    <td width="15%">
        <font face="verdana,arial,helvetica" size="2"><b>{history.MESSAGE_AUTHOR_FULL}</b></font>
    </td>
    <td width="70%">
        <font face="verdana,arial,helvetica" size="2">
            <a href="{history.U_VIEW_MESSAGE}"><b>{history.SUBJECT}</b></a>
        </font>
    </td>
    <td width="15%" align="right">
        <font face="verdana,arial,helvetica" size="1">{history.SENT_DATE}</font>
    </td>
</tr>
<!-- END history -->

</table>
