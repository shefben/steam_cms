<!-- IF S_SIMPLE_MESSAGE -->
	<!-- INCLUDE simple_header.html -->
<!-- ELSE -->
	<!-- INCLUDE overall_header.html -->
<!-- ENDIF -->

<!-- Message Display -->
<br />
<table cellpadding="0" cellspacing="0" border="0" width="70%" align="center">
<tr>
	<td>
		<table cellpadding="0" cellspacing="0" border="0" bgcolor="#282E22" width="100%">
		<tr>
			<td>
				<table class="vb-grid" cellpadding="4" cellspacing="1" border="0" width="100%">
				<tr>
					<td bgcolor="#3E4637">
						<font face="verdana,arial,helvetica" size="1" color="#D8DED3"><img src="{T_THEME_PATH}/images/vb_bullet.gif" alt="" align="absmiddle" />&nbsp;<b>{MESSAGE_TITLE}</b></font>
					</td>
				</tr>
				<tr>
					<td bgcolor="#3E4637">
						<font face="verdana,arial,helvetica" size="2">
						{MESSAGE_TEXT}
						</font>

						<!-- IF S_USER_NOTICE -->
						<br /><br />
						<font face="verdana,arial,helvetica" size="1">
						<a href="{U_LOGIN_LOGOUT}">{L_LOGIN_LOGOUT}</a>
						</font>
						<!-- ENDIF -->

						<!-- IF L_RETURN_TO -->
						<br /><br />
						<font face="verdana,arial,helvetica" size="1">
						<a href="{U_RETURN_TO}">{L_RETURN_TO}</a>
						</font>
						<!-- ENDIF -->

						<!-- IF SCRIPT_NAME eq 'search' -->
						<br /><br />
						<font face="verdana,arial,helvetica" size="1">
						<a href="{U_SEARCH}">{L_GO_TO_SEARCH_ADV}</a>
						</font>
						<!-- ENDIF -->

						<!-- IF S_META -->
						<br /><br />
						<font face="verdana,arial,helvetica" size="1">
						{L_REDIRECT}
						</font>
						<!-- ENDIF -->
					</td>
				</tr>
				</table>
			</td>
		</tr>
		</table>
	</td>
</tr>
</table>
<br />

<!-- IF S_SIMPLE_MESSAGE -->
	<!-- INCLUDE simple_footer.html -->
<!-- ELSE -->
	<!-- INCLUDE overall_footer.html -->
<!-- ENDIF -->
