<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<title><!-- IF UNREAD_NOTIFICATIONS_COUNT -->({UNREAD_NOTIFICATIONS_COUNT}) <!-- ENDIF --><!-- IF not S_VIEWTOPIC and not S_VIEWFORUM -->{SITENAME} - <!-- ENDIF --><!-- IF S_IN_MCP -->{L_MCP} - <!-- ELSEIF S_IN_UCP -->{L_UCP} - <!-- ENDIF -->{PAGE_TITLE}<!-- IF S_VIEWTOPIC or S_VIEWFORUM --> - {SITENAME}<!-- ENDIF --></title>

<!-- IF U_CANONICAL -->
	<link rel="canonical" href="{U_CANONICAL}">
<!-- ENDIF -->

<link href="{T_THEME_PATH}/storefront.css" rel="stylesheet" type="text/css"/>
<link href="{T_THEME_PATH}/styles_global.css" rel="stylesheet" type="text/css"/>
<link href="{T_THEME_PATH}/styles_capsules.css" rel="stylesheet" type="text/css"/>
<link href="{T_THEME_PATH}/styles_content.css" rel="stylesheet" type="text/css"/>
<link href="{T_THEME_PATH}/styles_lists.css" rel="stylesheet" type="text/css"/>

<!-- IF S_ENABLE_FEEDS -->
	<!-- IF S_ENABLE_FEEDS_OVERALL --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {SITENAME}" href="{{ path('phpbb_feed_index') }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_NEWS --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_FEED_NEWS}" href="{{ path('phpbb_feed_news') }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_FORUMS --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_ALL_FORUMS}" href="{{ path('phpbb_feed_forums') }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_TOPICS --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_FEED_TOPICS_NEW}" href="{{ path('phpbb_feed_topics') }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_TOPICS_ACTIVE --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_FEED_TOPICS_ACTIVE}" href="{{ path('phpbb_feed_topics_active') }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_FORUM and S_FORUM_ID --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_FORUM} - {FORUM_NAME}" href="{{ path('phpbb_feed_forum', { forum_id : S_FORUM_ID } ) }}"><!-- ENDIF -->
	<!-- IF S_ENABLE_FEEDS_TOPIC and S_TOPIC_ID --><link rel="alternate" type="application/atom+xml" title="{L_FEED} - {L_TOPIC} - {TOPIC_TITLE}" href="{{ path('phpbb_feed_topic', { topic_id : S_TOPIC_ID } ) }}"><!-- ENDIF -->
<!-- ENDIF -->

<script language="JavaScript" src="{T_THEME_PATH}/minmax.js" type="text/javascript"></script>
<script language="JavaScript" src="{T_THEME_PATH}/javascript.js" type="text/javascript"></script>

{STYLESHEETS}

<!-- EVENT overall_header_stylesheets_after -->

{META}

<!-- EVENT overall_header_head_append -->
</head>
<body class="{S_CONTENT_DIRECTION} {BODY_CLASS}">

<!-- EVENT overall_header_body_before -->

<div id="wrap" class="wrap">
	<div id="page-header">
		<!-- Steam 2006 v1 Header Bar -->
		<div style="min-width:850px;">
			<div class="globalHeadBar_logo">
				<a href="{U_INDEX}"><img alt="Steam main" border="0" src="{T_THEME_PATH}/img/logo_steam_header.jpg"/></a>
			</div>
			<div class="globalHeadBar">
				<div class="globalNavItem"><a href="{U_INDEX}" title="Home"><span class="globalNavLink">HOME</span></a></div>
				<div class="globalNavItem"><a href="{U_INDEX}?area=news" title="News"><span class="globalNavLink">NEWS</span></a></div>
				<div class="globalNavItem"><a href="{U_INDEX}?area=getsteamnow" title="Get Steam"><span class="globalNavLink">GET STEAM NOW</span></a></div>
				<div class="globalNavItem"><a href="#" title="Cyber Cafes"><span class="globalNavLink">CYBER CAFÉS</span></a></div>
				<div class="globalNavItem"><a href="#" title="Support"><span class="globalNavLink">SUPPORT</span></a></div>
				<div class="globalNavItem"><a href="{U_INDEX}" title="Forums"><span class="globalNavLink">FORUMS</span></a></div>
				<div class="globalNavItem"><a href="{U_INDEX}?area=stats" title="Status"><span class="globalNavLink">STATS</span></a></div>
			</div>
		</div>
		<br clear="all"/>
	</div>

	<!-- EVENT overall_header_page_body_before -->

	<div id="page-body" class="page-body" role="main">
		<center>
			<div class="contentBG_3">
				<div class="headerBG_3">
					<!-- Steam 2006 v1 Left Sidebar -->
					<div class="leftMenu_2" style="display: inline;">
						<div class="menu_item"><a href="{U_INDEX}">Home</a></div>
						<hr class="menu_spacer"/>
						<div class="menu_item"><a href="{U_INDEX}?area=all">All Games</a></div>
						<div class="menu_item"><a href="{U_INDEX}?area=browse">Browse Games</a></div>
						<div class="menu_item"><a href="{U_SEARCH}">Search</a></div>
						<hr class="menu_spacer"/>
						<div class="menu_item"><a href="{U_INDEX}?area=free">Free Stuff</a></div>
						<div class="menu_item"><a href="{U_INDEX}?area=media">Videos</a></div>
					</div>

					<!-- Main Content Area Start -->
